name: opencodex

services:
  hub:
    image: ghcr.io/satorivoid/opencodex:latest
    pull_policy: always
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s

    # By default the service is reachable only from this host.
    ports:
      - "${OPENCODEX_BIND_ADDRESS:-127.0.0.1}:${OPENCODEX_PORT:-10100}:10100"

    environment:
      # A custom CODEX_HOME also requires a matching writable volume target.
      CODEX_HOME: /home/bun/.codex

    volumes:
      - ocx-state:/home/bun/.opencodex
      - codex-state:/home/bun/.codex

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  ocx-state:
  codex-state:
